# F-Droid reproducibility check (scripts/check-reproducible.sh, docs/fdroid/README.md).
# Run by hand: with no tag it checks the selected commit builds identically
# twice; with a release tag it also compares the published signed APK against
# a fresh build of that tag, which is what F-Droid verifies before publishing.
name: Reproducible build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify against its GitHub release APK (optional)'
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download the release APK
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern 'ParemLauncher-*.apk' --dir release

      - name: Build twice and compare
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            scripts/check-reproducible.sh "$TAG" "release/ParemLauncher-$TAG.apk"
          else
            scripts/check-reproducible.sh HEAD
          fi
