name: Motion with animations enabled

on:
  workflow_dispatch:
  push:
    branches: [feat/motion]

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build before and after debug APKs
        run: |
          git worktree add --detach ../motion-before 094455cc791075102eaee66dcfd1803ca2603020
          (cd ../motion-before && ./gradlew assemblePlayDebug assemblePlayDebugAndroidTest)
          ./gradlew assemblePlayDebug assemblePlayDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record and test real-time flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/motion-review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-review
          path: |
            app/build/motion-review/
            app/build/ci-incidents/
          if-no-files-found: error
          retention-days: 14
