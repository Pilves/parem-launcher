name: Debug APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Manual runs only: release.yml publishes, so this is the way to prove the
      # Play bundle before a tag. Same two gradle runs as release.yml, signed with
      # this run's debug key, which Play refuses, so the bundle cannot go up by mistake.
      - name: Build release APK and Play bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          # AGP's location depends on the runner's environment, so look it up.
          KEYSTORE_FILE="$(find "$HOME" -name debug.keystore -print -quit)"
          export KEYSTORE_FILE
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload release APK, Play bundle and R8 mapping
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: play-check
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
