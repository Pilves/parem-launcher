name: Unit tests

on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test harness scripts
        run: node --test scripts/*.test.mjs scripts/test-inventory/*.test.mjs
      - name: Test both flavors and build both debug APKs
        run: ./gradlew testFullDebugUnitTest testPlayDebugUnitTest assembleFullDebug assemblePlayDebug
      - name: Check Play APK
        run: scripts/check-play-build.sh app/build/outputs/apk/play/debug/app-play-debug.apk
