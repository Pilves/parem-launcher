name: Pause film capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Play pause on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell cmd uimode night no
            ./gradlew connectedPlayDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.parem.launcher.PauseFilmCapture -Pandroid.testInstrumentationRunnerArguments.filmCapture=true
            mkdir -p capture
            adb pull /sdcard/parem-pause.mp4 capture/pause-play-unreviewed.mp4
            git rev-parse HEAD > capture/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pause-film-play-unreviewed
          path: capture/
          if-no-files-found: error
