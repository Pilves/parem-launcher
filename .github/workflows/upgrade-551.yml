name: Upgrade from v5.5.1

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build old and new debug APKs with the same key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000
          fi
          git worktree add --detach ../parem-551 v5.5.1
          (cd ../parem-551 && ./gradlew assembleDebug)
          cp scripts/upgrade/Upgrade551Test.kt app/src/androidTest/java/com/parem/launcher/
          ./gradlew assembleFullDebug assembleFullDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install v5.5.1, seed, upgrade and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/upgrade/run-551.sh
