name: Large text small phone capture
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew installPlayDebug installPlayDebugAndroidTest
            adb shell wm size 320x640
            adb shell wm density 160
            adb shell pm clear com.parem.launcher.debug
            set +e
            adb shell am instrument -w -e smallPhoneCapture true -e class com.parem.launcher.LargeTextSmallPhoneCaptureTest com.parem.launcher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee large-text-instrumentation.txt
            adb pull /data/local/tmp/parem-large ./large-text-capture
            grep -q 'OK (1 test)' large-text-instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-text-small-phone
          path: |
            large-text-capture/
            large-text-instrumentation.txt
          if-no-files-found: warn
