# Installs the actual R8/resource-shrunk variants. This workflow never publishes.
name: Minified release smoke

on:
  workflow_dispatch:
  push:
    branches: [release/v6.0.0, ci/minified-release-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: full
            task: Full
          - flavour: play
            task: Play
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/ci-debug.keystore
      KEYSTORE_PASSWORD: android
      KEY_ALIAS: androiddebugkey
      KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Create disposable debug signing key
        run: keytool -genkeypair -keystore "$KEYSTORE_FILE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build minified release and its test APK
        run: ./gradlew -PtestRelease assemble${{ matrix.task }}Release assemble${{ matrix.task }}ReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise release on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/minified-release-smoke.sh ${{ matrix.flavour }}
      - name: Upload logcat and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minified-release-${{ matrix.flavour }}-logs
          path: app/build/reports/minified-release/
          if-no-files-found: warn
          retention-days: 14
