name: Widget picker profile and captures
on:
  pull_request:
    branches: [master]
    paths:
      - app/src/main/java/com/parem/launcher/ui/HomeWidgetController.kt
      - app/src/main/java/com/parem/launcher/ui/WidgetPickerChrome.kt
      - app/src/main/java/com/parem/launcher/helper/WidgetPickerLabels.kt
      - app/src/androidTest/java/com/parem/launcher/WidgetPickerProfileTest.kt
      - app/src/androidTest/java/com/parem/launcher/WidgetPickerCaptureTest.kt
      - app/src/androidTest/java/com/parem/launcher/WidgetPickerGeneratedPreviewTest.kt
      - app/src/androidTest/java/com/parem/launcher/WidgetPickerOverflowTest.kt
      - scripts/widget-picker-profile/**
      - .github/workflows/widget-picker-profile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build disposable synthetic widget providers
        run: bash scripts/widget-picker-profile/build-fixture.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure and capture real picker on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          profile: pixel_6
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: WIDGET_PICKER_CAPTURE=true bash scripts/widget-picker-profile/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-picker-profile-${{ github.run_id }}
          path: |
            app/build/widget-picker-profile/
            app/build/ci-incidents/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 30
