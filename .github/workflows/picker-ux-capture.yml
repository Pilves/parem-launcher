name: Picker UX captures
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/com/parem/launcher/ui/AppPickerAdapter.kt'
      - 'app/src/main/java/com/parem/launcher/ui/PickerSheetLayout.kt'
      - 'app/src/main/java/com/parem/launcher/ui/BottomSheetMenu.kt'
      - 'app/src/main/java/com/parem/launcher/ui/CreateFolderDialog.kt'
      - 'app/src/main/java/com/parem/launcher/ui/FocusModeDialog.kt'
      - 'app/src/main/java/com/parem/launcher/ui/QuietListSheet.kt'
      - 'app/src/main/java/com/parem/launcher/ui/ScreenTimeLimitDialog.kt'
      - 'app/src/main/java/com/parem/launcher/helper/AppPickerSections.kt'
      - 'app/src/main/java/com/parem/launcher/helper/PickerKeyboardPolicy.kt'
      - 'app/src/androidTest/java/com/parem/launcher/PickerCaptureTest.kt'
      - 'scripts/capture-picker-ux.sh'
      - '.github/workflows/picker-ux-capture.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real picker routes on a disposable phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/capture-picker-ux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picker-ux-captures-${{ github.run_id }}
          path: |
            app/build/picker-ux/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 30
