apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.parem.launcher"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 103
        versionName "v6.0.0-beta.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        resourceConfigurations += ["en", "ar", "de", "es-rES", "es-rUS", "fr", "he", "hr", "hu", "in", "it", "ja", "pl", "pt-rBR", "ru-rRU", "sv", "tr", "uk", "zh"]
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }
    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled true
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    // The dependency-info block is a Google-encrypted blob in the APK signing
    // block that F-Droid and IzzyOnDroid reject. The Play bundle keeps it.
    dependenciesInfo {
        includeInApk = false
    }
    namespace 'com.parem.launcher'
    // Not loaded at runtime by anything here: the builtins serve kotlin-reflect
    // (not a dependency), the probes file serves the coroutines debugger, the
    // rest are build-tool stamps (M3-WP10 perf audit).
    packaging {
        resources.excludes += [
            'kotlin/**',
            'DebugProbesKt.bin',
            'META-INF/*.version',
            'META-INF/androidx/**',
            'META-INF/com/android/build/**',
            'META-INF/version-control-info.textproto',
            'META-INF/versions/**',
        ]
    }
}

dependencies {
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit

    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.uiautomator
    androidTestUtil libs.androidx.test.orchestrator

}